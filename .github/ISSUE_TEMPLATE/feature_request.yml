name: Feature request / 改进建议
description: Suggest a focused improvement / 提出具体的改进场景
title: "[Feature]: "
body:
  - type: textarea
    id: problem
    attributes:
      label: Use case / 使用场景
      description: Describe the task you are trying to complete and the current obstacle.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior / 期望行为
      description: Explain what the interface or recording process should do.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Current workaround / 当前替代方式
      description: Include any workaround you have tried, without private URLs or credentials.
